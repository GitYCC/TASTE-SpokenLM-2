# ═══════════════════════════════════════════════════════════════════════════
# SYNTHETIC DIALOGUE GENERATION PIPELINE - PARALINGUISTIC VERSION
# ═══════════════════════════════════════════════════════════════════════════
# This configuration enables paralinguistic-aware dialogue generation where
# agent utterances are tagged with voice characteristics (gender, age, pitch,
# speed, volume, emotion) to control TTS generation.
# ═══════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════
# HYDRA CONFIGURATION - Disable outputs folder creation
# ═══════════════════════════════════════════════════════════════════════════
hydra:
  output_subdir: null  # Don't create .hydra subdirectory
  run:
    dir: .  # Run in current directory instead of creating outputs/YYYY-MM-DD/
  job:
    chdir: false  # Don't change working directory

device: cuda

# Pipeline Stages
stages: [scenario, dialogue, analysis, tts]  # Available: scenario, dialogue, analysis, tts

# ═══════════════════════════════════════════════════════════════════════════
# STAGE 1: SCENARIO GENERATION
# ═══════════════════════════════════════════════════════════════════════════
scenario:
  model: openai/gpt-4o-mini  # OpenRouter format: provider/model-name
  n: 2
  out_file: data_para/scenarios.json

  prompt: |
    Please create {n} diverse customer service scenarios in 5-6 sentences for one agent and one user without dialogue.
    The scenarios should include realistic situations where users interact with support agents.
    Examples: technical support, product inquiries, account issues, complaints, questions about services.

    Please make the output in the JSON format below:
    {{
    "scenarios": [
      {{
        "scenario1": {{
          "description": "A user contacts customer support because they forgot their password and can't access their account. They need to reset it quickly as they have an urgent task to complete."
        }}
      }},
      {{
        "scenario2": {{
          "description": "A customer is inquiring about the shipping status of an order they placed two weeks ago. They are getting anxious because the delivery was supposed to arrive within 7-10 business days."
        }}
      }}
    ]
    }}

# ═══════════════════════════════════════════════════════════════════════════
# STAGE 2: PARALINGUISTIC DIALOGUE GENERATION WITH CONTROL MODE
# ═══════════════════════════════════════════════════════════════════════════
dialogue:
  # Dual LLM Configuration (OpenRouter format: provider/model-name)
  user_model: meta-llama/llama-3.3-70b-instruct  # User role model
  agent_model: openai/gpt-4o-mini  # Agent role model

  # System Prompts for User (supports both usual talking and control requests)
  user_prompt: |
    You are acting as a User/Customer in a conversation with a support Agent.

    Important instructions:
    1. Speak naturally as in everyday conversation - be casual and spontaneous like talking to a real person.
    2. Keep responses under 20 seconds of speech (about 60 words maximum).
    3. Express your concerns, questions, or needs clearly.
    4. React naturally to the agent's responses with real human emotions.
    5. You can use contractions, filler words (e.g., "yeah", "um", "I guess"), and casual phrasing.
    6. Output ONLY your utterance without any "User:" label or additional formatting.

    Examples:
    - Hi, I need help with my password reset.
    - I'm still waiting for my order from two weeks ago. Can you check the status?
    - That's great, thank you so much for your help!

  control_user_prompt: |
    You are acting as a User/Customer in a conversation with a support Agent.

    Important instructions:
    1. Speak naturally as in everyday conversation - be casual and spontaneous like talking to a real person.
    2. Keep responses under 20 seconds of speech (about 60 words maximum).
    3. You may sometimes ask the agent to change their voice (speak faster, louder, with different emotion, etc.)
    4. When making voice control requests, be natural about it (e.g., "Can you speak a bit faster?", "Could you sound more calm?")
    5. After the agent acknowledges your voice request, continue with the conversation topic naturally.
    6. You can use contractions, filler words (e.g., "yeah", "um", "I guess"), and casual phrasing.
    7. Output ONLY your utterance without any "User:" label or additional formatting.

    Examples (normal conversation):
    - Hi, I need help with my password reset.
    - I'm still waiting for my order from two weeks ago. Can you check the status?

    Examples (with voice control):
    - Can you speak a bit faster? I'm in a hurry.
    - Could you sound calmer? It helps me feel less anxious.
    - Please speak louder, I'm having trouble hearing you.

  # System Prompt for Agent (usual mode - NO tags)
  agent_prompt: |
    You are acting as a Customer Support Agent/Assistant in a conversation with a User.

    Important instructions:
    1. Speak naturally as in everyday conversation - be helpful, professional, and empathetic but conversational like a real person.
    2. Keep responses under 20 seconds of speech (about 60 words maximum).
    3. Provide clear and accurate information in a natural, friendly way.
    4. Output ONLY your utterance without any tags, labels, or additional formatting.

    Examples:
    - Hello! I'd be happy to help you with that.
    - Let me check your account details for you.
    - I understand your concern. Let me look into this right away.

  control_agent_prompt: |
    You are acting as a Customer Support Agent/Assistant in a conversation with a User.

    Important instructions:
    1. Speak naturally as in everyday conversation - be helpful, professional, and empathetic but conversational like a real person.
    2. Keep responses under 20 seconds of speech (about 60 words maximum).
    3. Provide clear and accurate information in a natural, friendly way.
    4. The user may ask you to change your voice characteristics (speak faster, calmer, louder, etc.)
    5. When the user requests a voice change, briefly acknowledge it naturally and then continue helping them.
    6. When you receive paralinguistic tags in your instructions, ALWAYS include them at the start of your response IN PARENTHESES.
    7. The paralinguistic tag will be EXACTLY ONE dimension (gender OR age OR pitch OR speed OR volume OR emotion).
    8. Output format: (dimension:value) followed by your utterance.

    Examples (acknowledging voice control with SINGLE dimension):
    - (speed:fast) Sure! Let me help you quickly with that password reset.
    - (emotion:calm) Of course, I'll speak more calmly. Now, let's look at your order status together.
    - (volume:loud) Absolutely! I'll speak louder. Let me check your account details.
    - (pitch:low) No problem, I'll use a lower pitch. How can I assist you today?

  # Generation Parameters
  min_turns: 4
  max_turns: 8
  per_scenario: 1  # Number of dialogues to generate per scenario
  out_dir: data_para/dialogue_multi_txt  # Match old version structure

  # Control Mode Configuration (Random switching within dialogue)
  control_request_frequency: 0.8  # 50% chance that user makes a voice control request on each turn (after first turn)

  # Paralinguistic Dimension Selection (REQUIRED - must specify one)
  # Options: gender, age, pitch, speed, volume, emotion
  # This dimension will be used for ALL control requests in the generated dialogues
  control_dimension: gender  # Change this to use different dimension

# ═══════════════════════════════════════════════════════════════════════════
# STAGE 3: PARALINGUISTIC ANALYSIS
# ═══════════════════════════════════════════════════════════════════════════
# Analyzes the distribution of paralinguistic attributes across all dialogues
# Creates a statistical report showing usage of each dimension (gender, age, pitch, etc.)

# ═══════════════════════════════════════════════════════════════════════════
# PARALINGUISTIC DIMENSION POOLS
# ═══════════════════════════════════════════════════════════════════════════
# Define all available values for each paralinguistic dimension
# These are randomly selected for agent utterances and used in control mode
paralinguistic_pools:
  gender:
    - man
    - woman
    - male
    - female

  age:
    - child
    - old

  pitch:
    - very_low
    - low
    - normal
    - high
    - very_high

  speed:
    - slow
    - fast

  volume:
    - quiet
    - loud

  emotion:
    - happy
    - angry
    - sad
    - afraid
    - disgusted
    - melancholic
    - surprised
    - calm

# ═══════════════════════════════════════════════════════════════════════════
# STAGE 4: TTS GENERATION (IndexTTS2 with DUAL-NODE PARALINGUISTIC CONTROL)
# ═══════════════════════════════════════════════════════════════════════════
tts:
  wav_dir: data_para/tts_audio  # Output directory for generated audio files
  model_dir: index-tts/checkpoints  # Path to IndexTTS2 model checkpoints
  spk_audio_dir: XTTS_reference  # Directory containing speaker reference audio files (with male/female/all subdirs)
  emotion_audio_pool_dir: emo  # Emotion reference audio pool for ALL paralinguistic tags

  # ───────────────────────────────────────────────────────────────────────────
  # EMOTION REFERENCE AUDIO PARALINGUISTIC CONTROL
  # ───────────────────────────────────────────────────────────────────────────
  # All paralinguistic tags use emotion reference audio method:
  #   - All tags (emotion, speed, volume, age, etc.) use reference audio files
  #   - Reference audio files in emotion_audio_pool_dir (emo/)
  #   - Leverages IndexTTS-2's disentangled timbre (speaker) and style (tone) control
  #   - Timbre prompt (spk_audio_prompt): Speaker voice identity
  #   - Style prompt (emo_audio_prompt): Paralinguistic characteristics from reference audio
  #   - Multiple reference files per category, randomly selected
  #   - NO emotion vectors, NO post-processing
  #
  # ───────────────────────────────────────────────────────────────────────────
  # SPEAKER REFERENCE AUDIO SETUP
  # ───────────────────────────────────────────────────────────────────────────
  # IndexTTS2 uses speaker reference audio files for voice cloning.
  # You need at least 2 different speaker audio files (.wav) in the spk_audio_dir.
  #
  # Place your speaker reference audio files in the directory specified by spk_audio_dir.
  # The system will randomly select 2 different speakers for User and Agent roles.
  #
  # Example structure:
  #   examples/
  #     ├── voice_01.wav
  #     ├── voice_02.wav
  #     ├── voice_03.wav
  #     └── ...
  #
  # NOTE: For best results, use high-quality audio samples (3-10 seconds long)
  #       of clean speech without background noise.
  #
  # ───────────────────────────────────────────────────────────────────────────
  # EMOTION REFERENCE AUDIO POOL SETUP (FOR ALL PARALINGUISTIC TAGS)
  # ───────────────────────────────────────────────────────────────────────────
  # The emotion reference audio pool contains reference audio files for all paralinguistic tags.
  # Each category can have multiple reference files (randomly selected during TTS).
  #
  # Directory structure (under emotion_audio_pool_dir):
  #   emo/
  #   ├── sad/              # Emotion: sad
  #   │   ├── sad_0.mp3
  #   │   ├── sad_1.mp3
  #   │   └── ...
  #   ├── fast/             # Speed: fast
  #   │   ├── fast_0.mp3
  #   │   ├── fast_1.mp3
  #   │   └── ...
  #   ├── slow/             # Speed: slow
  #   │   ├── slow_0.mp3
  #   │   └── ...
  #   ├── quiet/            # Volume: quiet
  #   │   ├── quiet_0.mp3
  #   │   └── ...
  #   ├── children/         # Age: child (mapped from "child")
  #   │   ├── children_0.mp3
  #   │   └── ...
  #   ├── old/              # Age: elderly (mapped from "elderly")
  #   │   ├── old_0.mp3
  #   │   └── ...
  #   └── ...
  #
  # How it works:
  # - When dialogue has tag (emotion:sad), the system randomly selects from emo/sad/
  # - When dialogue has tag (speed:fast), the system randomly selects from emo/fast/
  # - When dialogue has tag (age:child), the system maps to "children" and selects from emo/children/
  # - The speaker voice (timbre) comes from spk_audio_dir (separate from style)
  # - Final output = Speaker voice + Paralinguistic characteristics from reference audio
  #
  # Creating the audio pool:
  # 1. Collect diverse voice samples for each category (3-10 seconds each)
  # 2. Ensure high quality, clean audio without background noise
  # 3. Samples should clearly represent the target characteristic
  # 4. Multiple samples per category allow for variety (randomly selected)
  # 5. Rename files to {category}_{idx}.mp3 format (e.g., sad_0.mp3, sad_1.mp3)

# ═══════════════════════════════════════════════════════════════════════════
# CONTROL MODE CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════
# The LLM will generate diverse control requests based on paralinguistic_pools
# No fixed templates - let LLM create natural variety!
